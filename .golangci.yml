# golangci-lint v2 configuration for Spotter.
#
# v0.2.0 — opt the foundational linters back in now that the worst
# `_ = err` patterns have been retired (see commit history). They run
# on every PR; new offenders must use a justification comment:
#
#     _ = someFn() //nolint:errcheck // short-lived loop tick, log later
#
# Anything beyond these is opt-in per-PPR as the project grows.
#
# Reference: https://golangci-lint.run/product/migration-guide/

version: "2"

run:
  # CI timeout must be smaller than golangci-lint-action's --timeout.
  timeout: 4m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      # v2 schema: local-prefixes is an array, not a single string.
      local-prefixes:
        - github.com/spotter/spotter
