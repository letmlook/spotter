# golangci-lint v2 configuration for Spotter.
#
# Lint set is intentionally minimal during 0.x. We run formatter
# checks (gofmt / goimports) on every PR, but skip the heavier code-
# review linters (errcheck, revive, staticcheck, etc.) until the
# codebase grows proper nolint hygiene. To opt a linter back in,
# add it to `linters.enable` and fix whatever it surfaces.
#
# Reference: https://golangci-lint.run/product/migration-guide/

version: "2"

run:
  # CI timeout must be smaller than golangci-lint-action's --timeout.
  timeout: 4m
  tests: true

linters:
  default: none
  # Nothing enabled here on purpose — gofmt / goimports moved to the
  # `formatters` block below per v2 schema. Re-enable linters as the
  # codebase stabilises.

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      # v2 schema: local-prefixes is an array, not a single string.
      local-prefixes:
        - github.com/spotter/spotter
