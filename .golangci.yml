# golangci-lint v2 configuration for Spotter.
# Migration notes: from v1 we used `disable-all: true` + `enable:`; in
# v2 the equivalent is `default: none`. `linters-settings.<linter>`
# became `linters.settings.<linter>`. Skip dirs / files moved to
# `linters.exclusions.paths` (and similarly on the formatters side).
# Reference: https://golangci-lint.run/product/migration-guide/

version: "2"

run:
  # CI timeout must be smaller than golangci-lint-action's --timeout.
  timeout: 4m
  tests: true

linters:
  default: none

  enable:
    - bodyclose        # http.Response.Body Close()
    - errcheck         # unchecked errs
    - govet            # built-in vet
    - ineffassign      # :=
    - misspell         # common typos in comments
    - nolintlint       # validate //nolint: directives
    - prealloc         # for-range copy hint
    - revive           # golint successor
    - staticcheck      # staticcheck.io checks
    - unconvert        # redundant conversions
    - unused           # dead code

  settings:
    gocritic:
      disabled-checks:
        - hugeParam
        - rangeValCopy
    revive:
      rules:
        - name: var-naming
          severity: warning
        - name: exported
          severity: warning
        - name: error-strings
          severity: warning
        - name: error-return
          severity: warning
        - name: error-naming
          severity: warning

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: github.com/spotter/spotter
