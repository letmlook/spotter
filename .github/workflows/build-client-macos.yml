name: build-client-macos

# Build + codesign + notarize + DMG package for macOS. Requires
# Apple Developer secrets stored as repo Secrets; falls back to
# an unsigned-but-functional DMG if secrets are absent so the
# workflow still gates PRs on smoke tests.
#
# Required secrets:
#   MACOS_CERT_P12_BASE64  base64-encoded .p12 (Developer ID Application)
#   MACOS_CERT_PASSWORD    password for the above
#   APPLE_API_KEY_ID       App Store Connect API key id
#   APPLE_API_ISSUER_ID    issuer id
#   APPLE_API_KEY_BASE64   base64-encoded .p8 private key

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build & sign (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-14, tag: darwin-arm64 }
          - { arch: amd64, runner: macos-13, tag: darwin-x64 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build client
        run: |
          wails build -platform darwin/${{ matrix.arch }} -clean
          ls -l build/bin

      - name: Import signing certificate
        if: ${{ env.MACOS_CERT_P12_BASE64 != '' }}
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN=spotter-build.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -A
          security list-keychain -d user -s "$KEYCHAIN"

      - name: Codesign
        if: ${{ env.MACOS_CERT_P12_BASE64 != '' }}
        run: codesign --deep --force --options=runtime --sign "Developer ID Application: ${{ secrets.APPLE_TEAM_NAME }}" build/bin/Spotter.app

      - name: Notarize
        if: ${{ env.APPLE_API_KEY_BASE64 != '' }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_$APPLE_API_KEY_ID.p8
          ditto -c -k --sequesterRsrc --keepParent build/bin/Spotter.app build/bin/Spotter.zip
          xcrun notarytool submit build/bin/Spotter.zip --keychain-profile "spotter-notary" --wait
          xcrun stapler staple build/bin/Spotter.app

      - name: Build DMG
        if: always()
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Spotter ${{ github.ref_name }}" \
            --window-size 600 400 \
            --icon-size 120 \
            --icon "Spotter.app" 175 160 \
            --app-drop-link 425 160 \
            "dist/Spotter-${{ matrix.tag }}.dmg" \
            "build/bin/Spotter.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotter-client-${{ matrix.tag }}
          path: dist/*.dmg
