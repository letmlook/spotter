name: homebrew-formula

# Validates the Homebrew formula in scripts/packages/homebrew/spotter.rb
# at PR-time: parses the Ruby, recomputes the expected sha256 from
# the current HEAD, and asserts they match. The "recompute" is
# deterministic (git archive of HEAD) so the formula never falls
# behind again.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    name: ruby + sha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ruby syntax
        run: ruby -c scripts/packages/homebrew/spotter.rb

      - name: Recompute sha256 from v1.0.0 tag
        id: sha
        run: |
          set -e
          # Use the actual v1.0.0 annotated tag, NOT a moving HEAD.
          # git archive uses the tag tree so the sha is deterministic
          # across checkouts.
          if ! git rev-parse --verify v1.0.0 >/dev/null 2>&1; then
            echo "::warning::v1.0.0 tag missing in this checkout — formula check is bypassed"
            exit 0
          fi
          git archive --format=tar.gz --prefix=spotter-1.0.0/ v1.0.0 -o /tmp/spotter.tar.gz
          ACTUAL="$(sha256sum /tmp/spotter.tar.gz | awk '{print $1}')"
          echo "actual=$ACTUAL" >> "$GITHUB_OUTPUT"
          echo "actual=$ACTUAL"
          EXPECTED="$(grep -oE 'sha256 "[a-f0-9]{64}"' scripts/packages/homebrew/spotter.rb | head -1 | awk -F'"' '{print $2}')"
          echo "expected=$EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::sha mismatch — re-run scripts/update-homebrew-sha.sh with VERSION=v1.0.0"
            exit 1
          fi
          echo "OK sha matches formula"

      - name: verify init scripts syntactically
        run: |
          bash -n scripts/init/openrc/spotterd
          bash -n scripts/init/runit/spotterd.run
          bash -n scripts/install.sh
          bash -n scripts/update-homebrew-sha.sh
