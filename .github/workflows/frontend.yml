name: Frontend (build + typecheck)

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails CLI is needed for `wails generate module`, which scaffolds
      # frontend/wailsjs/* (gitignored). Without those stubs, every
      # import of ../wailsjs/... turns into a TS2307.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Pre-fetch Go modules (warms GOMODCACHE)
        run: go mod download -x

      # Pin the Wails CLI to match the version in go.mod
      # (`github.com/wailsapp/wails/v2 v2.14.0`). `go install @latest`
      # has been observed to hang on the indirect `pkg/errors v0.9.1`
      # download; pinning + goproxy.cn fallback + a warm GOMODCACHE
      # plus retry makes the cost reproducible.
      - name: Install Wails CLI
        env:
          GOPROXY: https://goproxy.cn,https://proxy.golang.org,direct
        run: |
          for i in 1 2 3 4; do
            if go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0; then
              break
            fi
            echo "go install wails: retry $i/4"
            sleep 20
          done
          wails version

      - name: Install Wails runtime deps (gtk3 + webkit2gtk)
        # Generate needs pkg-config + a few system headers to introspect
        # the bound Go types' JSON tags. Full GTK isn't strictly needed
        # for `generate` but keeps us compatible with `wails dev` later.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libxss-dev libsoup-3.0-dev pkg-config

      - name: Install npm dependencies
        run: npm ci --no-audit --fund=false

      - name: Generate Wails frontend bindings
        # `wails generate module` looks for `wails.json` (and through
        # it, the frontend folder) starting at cwd. `wails.json` lives
        # at the repo root, NOT inside frontend/, so we must run with
        # the repo as cwd. Earlier runs with `working-directory:
        # frontend` failed with "open frontend/wails.json: no such
        # file or directory".
        run: wails generate module

      - name: Type check
        # `npm run typecheck` is single-project (no references); the
        # referenced `tsconfig.node.json` sets `composite: true`, which
        # `tsc -b --noEmit` would reject with TS6310.
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 3
