name: Frontend (build + typecheck)

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails CLI is needed for `wails generate module`, which scaffolds
      # frontend/wailsjs/* (gitignored). Without those stubs, every
      # import of ../wailsjs/... turns into a TS2307.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # Pin the Wails CLI to match the version in go.mod
      # (`github.com/wailsapp/wails/v2 v2.14.0`). `go install @latest`
      # from CI has been observed to hang on indirect deps
      # (`pkg/errors v0.9.1`); pinning + retry makes the cost
      # reproducible.
      - name: Install Wails CLI
        env:
          GOPROXY: https://goproxy.cn,https://proxy.golang.org,direct
        run: |
          for i in 1 2 3; do
            if go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0; then
              break
            fi
            echo "go install wails: retry $i/3"
            sleep 15
          done
          wails version

      - name: Install Wails runtime deps (gtk3 + webkit2gtk)
        # Generate needs pkg-config + a few system headers to introspect
        # the bound Go types' JSON tags. Full GTK isn't strictly needed
        # for `generate` but keeps us compatible with `wails dev` later.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libxss-dev libsoup-3.0-dev pkg-config

      - name: Install npm dependencies
        run: npm ci --no-audit --fund=false

      - name: Generate Wails frontend bindings
        # Wails reads the Go bound types and writes
        # frontend/wailsjs/{go/main/App.js,App.d.ts} and
        # frontend/wailsjs/runtime/runtime.{js,d.ts}. The .gitignore
        # filters these out, so we must regenerate on every CI run.
        run: wails generate module

      - name: Type check
        # `npm run typecheck` is single-project (no references); the
        # referenced `tsconfig.node.json` sets `composite: true`, which
        # `tsc -b --noEmit` would reject with TS6310.
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 3
