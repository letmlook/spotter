name: Go (test + lint)

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel in-flight runs when a new commit lands on the same branch, to
# avoid burning minutes on obsolete pushes.
concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Several jobs need `frontend/dist` (because main.go does
# `//go:embed all:frontend/dist`) but the directory is gitignored and
# the CI image does not ship it. Build it once in `frontend-dist`,
# upload as an artifact, and let the rest of the jobs download it.
jobs:
  frontend-dist:
    name: build frontend (incl. wailsjs stubs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails CLI is needed because `npm run build` triggers `tsc -b`,
      # which type-checks the React source. The source imports from
      # `frontend/wailsjs/*`, which are gitignored — they must be
      # regenerated on every CI run via `wails generate module`.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install Wails runtime headers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libxss-dev libsoup-3.0-dev pkg-config

      - name: Pre-fetch Go modules (warms GOMODCACHE)
        run: go mod download -x

      - name: Install Wails CLI
        # Pin to go.mod (github.com/wailsapp/wails/v2 v2.14.0). On
        # runner images the indirect pkg/errors v0.9.1 occasionally
        # times out from proxy.golang.org; the retry + goproxy.cn
        # fallback covers that. Pre-fetching the module graph keeps
        # the retry's last attempt from re-downloading everything.
        env:
          GOPROXY: https://goproxy.cn,https://proxy.golang.org,direct
        run: |
          for i in 1 2 3 4; do
            if go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0; then
              break
            fi
            echo "go install wails: retry $i/4"
            sleep 20
          done
          wails version

      - name: Pre-build to populate go.sum
        # `wails generate module` invokes `go build` against the root
        # main package (which embeds `frontend/dist` and imports all
        # `wails/pkg/options/*` / `pkg/runtime`). A pre-`tidy` makes Go
        # fetch the wails module sub-packages and write the missing
        # h1 entries into go.sum so the embedded `go build` inside
        # wails later sees a consistent module graph. Building
        # ./cmd/agent or the root package directly won't necessarily
        # add the same modules (cmd/agent doesn't import wails at
        # all; root build fails the embed pattern without a real
        # frontend/dist). `go mod tidy` is the supported path for
        # adding missing go.sum entries without producing a binary.
        run: go mod tidy

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci --no-audit --fund=false

      # Chicken-and-egg fix: `wails generate module` introspects the
      # Go types bound through `wails.Run`. To do that, it compiles
      # main.go, which embeds `frontend/dist` and imports
      # `frontend/wailsjs/...`. Both must exist when generate runs,
      # but typecheck / vite-build (which create them) can't run until
      # the wailsjs stubs are in place. Solution: lay down a dummy
      # `frontend/dist` so the embed pattern resolves, run `wails
      # generate`, then real typecheck / build.
      - name: Stage empty frontend/dist for //go:embed
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Generate Wails frontend bindings
        # `wails generate module` looks for `wails.json` (and through
        # it, the frontend folder) starting at cwd. `wails.json` lives
        # at the repo root, NOT inside frontend/, so we must run with
        # the repo as cwd.
        run: wails generate module

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Production build (Vite)
        working-directory: frontend
        # `npm run build` runs `tsc -b && vite build`. Use it directly
        # now that the wailsjs stubs exist.
        run: npm run build

      - name: Upload frontend/dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 3

  test:
    name: test (Go ${{ matrix.go }})
    needs: frontend-dist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Restore frontend/dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Refresh go.sum (autofills wails sub-package h1 entries)
        # Each job `actions/checkout`s a fresh working tree; the
        # frontend-dist job's `go mod tidy` does NOT persist go.sum
        # across jobs via artifacts, so we run it again here to make
        # sure `go test ./...` and `golangci-lint` see a complete
        # module graph (wails/pkg/options/*, wails/pkg/runtime).
        run: go mod tidy

      - name: Verify module download integrity
        run: go mod download -x

      - name: Run go vet
        run: go vet ./...

      # `make test` runs every package under -race -count=1, matching the
      # command developers run locally. We deliberately do not pass -v
      # because the suite is large; failures print enough context.
      - name: Run unit tests with race detector
        run: make test

  lint:
    name: lint
    needs: frontend-dist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Restore frontend/dist
        # Without this, golangci-lint trips on main.go's //go:embed
        # pattern with "no matching files found".
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Refresh go.sum
        # Each job actions/checkouts a fresh working tree; the
        # frontend-dist job's `go mod tidy` does not persist go.sum
        # across jobs, so re-run it here.
        run: go mod tidy

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # v7 ships with golangci-lint v2 support; the v6 action
          # rejects v2 with "invalid version string 'v2.x',
          # you must update to golangci-lint-action v7".
          version: v2.5.0
          # `only-new-issues` keeps the action idempotent on long
          # branches by only flagging PR-introduced issues.
          only-new-issues: true
          args: --timeout=5m

  build-current:
    name: build (current GOOS/GOARCH)
    needs: frontend-dist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Restore frontend/dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Refresh go.sum
        run: go mod tidy

      - name: Build agent for host
        run: make agent

      - name: Upload agent binary
        uses: actions/upload-artifact@v4
        with:
          name: spotterd-linux-amd64
          path: bin/spotterd
          if-no-files-found: error
          retention-days: 7
