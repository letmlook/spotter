<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spotter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Spotter</h1>
    <div class="toolbar">
      <button id="deploy">Deploy device…</button>
      <button id="uninstall" disabled>Uninstall…</button>
      <button id="scan-subnet">Scan subnet</button>
      <button id="add-known">Add by IP…</button>
      <button id="refresh">Refresh</button>
      <button id="clear">Clear registry</button>
      <span id="status"></span>
    </div>
  </header>
  <main>
    <aside id="device-list">
      <table>
        <thead>
          <tr><th>IP</th><th>Port</th><th>User</th><th>Hostname</th><th>Status</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </aside>
    <section id="detail">
      <div id="detail-body"></div>
    </section>
  </main>
  <script src="app.js" type="module"></script>
</body>
</html>
